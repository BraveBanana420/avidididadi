name: Exercise animation / Animazione esercizio
description: Make an exercise animation with the project recipe, or propose the request for a new exercise / Fai l'animazione di un esercizio con la ricetta del progetto, o proponi la richiesta per un esercizio nuovo
title: "Animation: <exercise ID>"
labels: ["animation", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Read the guide first / Prima leggi la guida: [English](https://github.com/BraveBanana420/avidididadi/blob/staging/docs/animazioni/README.md) · [Italiano](https://github.com/BraveBanana420/avidididadi/blob/staging/docs/animazioni/README.it.md).
        **Only animations made with the project recipe** (`agents/animazione.mjs` and `docs/animazioni/richieste.json`, unchanged) can be accepted. Open this issue when you **start**, so nobody else makes the same exercise.
        **Si accettano solo animazioni fatte con la ricetta del progetto** (`agents/animazione.mjs` e `docs/animazioni/richieste.json`, senza modifiche). Apri la issue quando **inizi**, così nessun altro fa lo stesso esercizio.
  - type: input
    id: esercizio
    attributes:
      label: Exercise ID / ID dell'esercizio
      description: From / Da [EXERCISES.md](https://github.com/BraveBanana420/avidididadi/blob/staging/docs/animazioni/EXERCISES.md), e.g. `Shoulder_Stretch`
    validations:
      required: true
  - type: dropdown
    id: cosa
    attributes:
      label: What are you doing? / Cosa fai?
      options:
        - "I make the animation (🟢 exercise, approved request) / Faccio l'animazione (esercizio 🟢, richiesta approvata)"
        - "I propose the request (⬜ exercise): I won't spend anything until it's approved / Propongo la richiesta (esercizio ⬜): non spendo niente finché non è approvata"
    validations:
      required: true
  - type: textarea
    id: richiesta
    attributes:
      label: Proposed request (only for ⬜ exercises) / Richiesta proposta (solo per gli esercizi ⬜)
      description: In English. See "Exercise without a request" in the guide. / In inglese. Vedi "Esercizio senza richiesta" nella guida.
      placeholder: |
        vista: tre_quarti | lato | fronte
        partenza: avatar | genera
        posa: He ... (only with "genera")
        movimento: he ... (one slow repetition, back to the starting position)
  - type: textarea
    id: file
    attributes:
      label: Files / File
      description: |
        When it's ready: the ZIP of the whole work folder (max 25 MB) and the text printed by `node agents/animazione.mjs controlla`. You can leave it empty now and add it later in a comment. Never paste your API key.
        Quando è pronta: lo ZIP di tutta la cartella di lavoro (al massimo 25 MB) e il testo stampato da `node agents/animazione.mjs controlla`. Puoi lasciarlo vuoto e aggiungerlo dopo in un commento. Non incollare mai la tua chiave.
  - type: checkboxes
    id: regole
    attributes:
      label: Rules / Regole
      options:
        - label: I use the recipe as it is, from the current `staging`, without changing the script, the requests or the settings. / Uso la ricetta così com'è, dallo `staging` attuale, senza cambiare lo script, le richieste o le impostazioni.
          required: true
        - label: The costs are on my own OpenRouter account, and I stop and ask here after two failed videos. / I costi sono sul mio account OpenRouter, e dopo due video sbagliati mi fermo e chiedo qui.
          required: true
        - label: I release what I send under CC0 1.0 (public domain), labelled as AI-made, with the original video. / Rilascio quello che mando con licenza CC0 1.0 (pubblico dominio), segnato come fatto con l'IA, con il video originale.
          required: true
